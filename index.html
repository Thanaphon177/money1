<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เพนกวินออมเงิน · บันทึกรายรับรายจ่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bubbles" aria-hidden="true"><i style="left:6%;width:28px;height:28px;animation-duration:16s"></i><i style="left:22%;width:14px;height:14px;animation-duration:11s;animation-delay:-4s"></i><i style="left:41%;width:36px;height:36px;animation-duration:19s;animation-delay:-9s"></i><i style="left:58%;width:18px;height:18px;animation-duration:13s;animation-delay:-2s"></i><i style="left:73%;width:30px;height:30px;animation-duration:17s;animation-delay:-7s"></i><i style="left:90%;width:16px;height:16px;animation-duration:12s;animation-delay:-5s"></i></div>
<div class="app">
  <div class="top"><button id="prev" aria-label="เดือนก่อน">‹</button><span id="mlabel"></span><button id="next" aria-label="เดือนถัดไป">›</button></div>
  <div class="hero">
    <div class="pig" title="จิ้มเบาๆ">🐧</div>
    <small>เงินคงเหลือเดือนนี้</small>
    <div class="bal" id="bal">฿0</div>
    <div class="say" id="say"></div>
    <div class="split"><div class="a">🌱 รายรับ<b id="inc">฿0</b></div><div class="b">🍓 รายจ่าย<b id="exp">฿0</b></div></div>
  </div>

  <section class="v on" id="v-add">
    <div class="panel">
      <div class="seg"><button class="on e" data-t="e">🍓 รายจ่าย</button><button data-t="i">🌱 รายรับ</button></div>
      <div class="amtw"><i>฿</i><input class="amt" id="amt" type="number" inputmode="decimal" placeholder="0" aria-label="จำนวนเงิน"></div>
      <div class="chips" id="chips"></div>
      <div class="row2"><input class="inp" id="note" placeholder="โน้ตเล็กๆ น้อยๆ"><input class="inp" id="date" type="date" style="flex:.85"></div>
      <button class="save" id="save">บันทึกเลย 💙</button>
    </div>
    <div class="panel"><h2>🧸 ล่าสุด</h2><div id="recent"></div></div>
  </section>

  <section class="v" id="v-list"><div class="panel"><h2>📒 รายการเดือนนี้</h2><div id="all"></div></div></section>

  <section class="v" id="v-sum">
    <div class="panel"><h2>🍰 ใช้เงินไปกับอะไรบ้าง</h2><div id="cats"></div></div>
    <div class="panel"><button class="ghost" id="csv">📋 คัดลอกเป็น CSV</button><button class="ghost" id="clear">🗑️ ล้างข้อมูลทั้งหมด</button></div>
  </section>
</div>
<nav>
  <button class="on" data-v="add"><b>✏️</b>บันทึก</button>
  <button data-v="list"><b>📒</b>รายการ</button>
  <button data-v="sum"><b>🍰</b>สรุป</button>
</nav>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
